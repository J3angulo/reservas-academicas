name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      # Nota: los tests se omiten hasta que el equipo configure la base de datos
      # en src/main/resources/application.properties. Cuando esté lista,
      # cambiar -DskipTests por verify para ejecutarlos.
      - name: Compilar y empaquetar
        run: ./mvnw -B package -DskipTests
